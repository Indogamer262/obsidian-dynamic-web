    <style>
        html, body {
            margin: 0; padding: 20px; font-family: var(--font-text); 
            background-color: var(--background-primary, #1e1e1e); 
            color: var(--text-normal, #dcddde); 
            overflow-y: auto !important; /* Allow scrolling */
            height: 100% !important;
            min-height: 100vh !important;
            box-sizing: border-box;
        }
        .markdown-rendered { 
            max-width: 800px; /* Revert to 800px as user preferred */
            margin: 0 auto; 
            line-height: 1.6; 
        }
        
        /* Table Overrides */
        .markdown-rendered table {
            width: 100%;
            display: table !important;
            overflow: visible !important;
        }
        .markdown-rendered tbody > tr > td, 
        .markdown-rendered thead > tr > th {
            white-space: normal !important;
            word-break: normal !important;
            overflow: visible !important;
            height: auto !important;
            padding: 12px !important;
        }
        .is-unresolved { color: var(--text-muted); opacity: 0.6; }
        a.internal-link { text-decoration: none; color: var(--text-accent); }
        a.internal-link:hover { text-decoration: underline; }
        
        /* Callout Styling */
        .callout {
            border: 1px solid rgba(var(--callout-color), 0.25);
            border-radius: 4px;
            padding: 12px;
            margin: 1em 0;
            background-color: rgba(var(--callout-color), 0.1);
        }
        .callout-title {
            font-weight: bold;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: rgb(var(--callout-color));
        }
        .callout-title-inner { color: var(--text-normal); margin-left: 8px; }
        
        /* Fold Icon */
        .callout-fold {
            width: 16px; height: 16px;
            transition: transform 0.2s;
            color: var(--text-muted);
        }
        details.callout-collapsible > summary.callout-title { cursor: pointer; list-style: none; }
        details.callout-collapsible > summary.callout-title::-webkit-details-marker { display: none; }
        details.callout-collapsible[open] > summary.callout-title > .callout-fold { transform: rotate(90deg); }
        details.callout-collapsible > .callout-content { margin-top: 8px; padding-left: 24px; }
        
        /* Callout Colors */
        .callout[data-callout="info"], .callout[data-callout="todo"] { --callout-color: 8, 109, 221; }
        .callout[data-callout="note"] { --callout-color: 8, 109, 221; }
        .callout[data-callout="summary"], .callout[data-callout="tip"] { --callout-color: 0, 191, 188; }
        .callout[data-callout="success"] { --callout-color: 8, 185, 78; }
        .callout[data-callout="warning"], .callout[data-callout="question"] { --callout-color: 236, 117, 0; }
        .callout[data-callout="error"], .callout[data-callout="bug"], .callout[data-callout="fail"] { --callout-color: 233, 49, 71; }
        .callout[data-callout="example"] { --callout-color: 120, 82, 238; }
        .callout[data-callout="quote"] { --callout-color: 158, 158, 158; }
        
        img.obsidian-embed { max-width: 100%; border-radius: 4px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Init Mermaid
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });

            const rawMd = document.getElementById('raw-markdown').value;
            
            // Custom renderer for Mermaid in marked.js
            const renderer = new marked.Renderer();
            const originalCode = renderer.code.bind(renderer);
            renderer.code = function(code, language, isEscaped) {
                if (language === 'mermaid') {
                    return '<div class="mermaid">' + code + '</div>';
                }
                return originalCode(code, language, isEscaped);
            };
            
            marked.use({ renderer });
            
            // Allow marked to process HTML tags (so <span>[[halaman-lain]]</span> works seamlessly)
            const html = marked.parse(rawMd, { breaks: true, gfm: true });
            document.getElementById('content').innerHTML = html;

            // Highlight syntax
            hljs.highlightAll();

            // Render Mermaid diagrams
            setTimeout(() => {
                mermaid.run({
                    querySelector: '.mermaid'
                });
            }, 100);
        });
    </script>
